[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-ledger"
version = "0.2.1"
description = "Generate clean context packs for AI coding agents."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "kuto87" }]
license = { text = "MIT" }
keywords = ["ai", "cli", "context", "git", "handoff"]
dependencies = [
  "typer>=0.12,<0.13",
  "rich>=13.0,<14",
  "pyperclip>=1.8,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "build>=1.0,<2",
  "twine>=5.0,<7",
]

[project.urls]
Homepage = "https://github.com/kuto87/ctx-ledger"
Repository = "https://github.com/kuto87/ctx-ledger"
Issues = "https://github.com/kuto87/ctx-ledger/issues"

[project.scripts]
ctx = "ctx_ledger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
